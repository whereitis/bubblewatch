<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>bubblewatch: where are we in the mania?</title>
<meta name="description" content="Edward Chancellor's signals of a technology mania, read as a map. A gauge, not a signal.">
<style>
:root{color-scheme:light;--page:#f6f4ef;--surface:#fffdf9;--surface-2:#f0ede5;--ink:#1a1916;--ink-2:#55514a;--muted:#8a857b;

:root[data-theme="dark"]{color-scheme:dark;--page:#0f0f0e;--surface:#181816;--surface-2:#22211e;--ink:#f1efe9;--ink-2:#c4bfb4;--muted:#8f8a80;
--grid:#2b2a27;--axis:#3d3c38;--border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.17);--ember:#e2703f;--ember-soft:rgba(226,112,63,.17);
--ember-ink:#f29a6e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ctx:#8f8a80;--band:rgba(255,255,255,.06);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--page:#0f0f0e;--surface:#181816;--surface-2:#22211e;--ink:#f1efe9;
--ink-2:#c4bfb4;--muted:#8f8a80;--grid:#2b2a27;--axis:#3d3c38;--border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.17);--ember:#e2703f;
--ember-soft:rgba(226,112,63,.17);--ember-ink:#f29a6e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ctx:#8f8a80;--band:rgba(255,255,255,.06);
--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums lining-nums}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--page) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);
-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--border)}
.bar .in{max-width:1240px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;gap:18px}
.mark{display:flex;align-items:center;gap:10px;font:600 19px/1 var(--serif);letter-spacing:.005em;text-decoration:none}
.mark .dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4a37c,var(--ember) 60%);box-shadow:0 0 0 4px var(--ember-soft)}
.bar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:4px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page);font-weight:600}
.iconbtn{border:1px solid var(--border-2);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px;color:var(--ink-2)}
/* page frame */
.page{max-width:1240px;margin:0 auto;padding:0 32px 80px}
.banner{margin:18px 0 0;padding:9px 14px;border-radius:10px;background:var(--surface-2);color:var(--ink-2);font-size:13px;display:flex;gap:10px;align-items:center}
.banner b{color:var(--ink);font-weight:600}
.zhnote{margin:12px 0 0;padding:9px 14px;border-radius:10px;border:1px dashed var(--border-2);color:var(--ink-2);font-size:13.5px}
/* hero */
.hero{padding:44px 0 8px}
.eyebrow{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600}
h1{font:500 50px/1.06 var(--serif);letter-spacing:-.012em;margin:0 0 18px;max-width:900px}
.verdict{font:400 22px/1.45 var(--serif);color:var(--ink);max-width:860px;margin:0 0 6px}
.gauge{color:var(--ink-2);font-size:14px;margin:0;max-width:820px}
/* the map */
.map{margin:34px 0 10px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:26px 22px 20px;position:relative}
.track{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));position:relative}
.track:before{content:"";position:absolute;left:6.25%;right:6.25%;top:47px;height:2px;background:linear-gradient(90deg,var(--ember-soft),var(--grid) 30%,var(--grid))}
.node{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 6px 6px;border-radius:14px;position:relative;transition:background .15s}
.node:hover,.node:focus-visible{background:var(--surface-2)} .node:focus-visible{outline:2px solid var(--axis)}
.node .no{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:8px}
.glyph{width:30px;height:30px;border-radius:50%;position:relative;z-index:1;background:var(--surface);border:2px solid var(--axis);flex:none}
.glyph.lit{background:radial-gradient(circle at 35% 35%,#f6ad86,var(--ember) 62%);border-color:var(--ember);box-shadow:0 0 0 6px var(--ember-soft),0 0 22px var(--ember-soft)}
.glyph.mixed{border-color:var(--ember);background:linear-gradient(90deg,var(--ember) 50%,var(--surface) 50%);box-shadow:0 0 0 5px var(--ember-soft)}
.glyph.quiet{border-color:var(--ink-2)}
.glyph.unreviewed{border:2px dashed var(--muted);background:var(--page);opacity:.8}
.node .nm{font:600 18px/1.2 var(--serif);margin:14px 0 3px}
.node .rd{font-size:12.5px;color:var(--ink-2);min-height:36px;line-height:1.35}
.minis{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:8px;min-height:12px}
.mini{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-2);background:transparent}
.mini.on{background:var(--ember);border-color:var(--ember)} .mini.nl{border-radius:2px;transform:rotate(45deg);width:8px;height:8px}
.mini.ur{border:1.5px dotted var(--muted)}
.legend{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin:18px 0 0;padding-top:14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend .glyph{width:13px;height:13px;border-width:1.5px;box-shadow:none}
/* how to read */
.howto{display:grid;grid-template-columns:200px 1fr;gap:20px;margin:26px 0 0;padding:0 22px}
.howto h2{font:600 13px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:3px 0 0}
.howto ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.howto li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px;color:var(--ink-2);line-height:1.5}
.howto .hn{font:500 20px/1.1 var(--serif);color:var(--ember-ink)}
.checks .pd{display:block;font-size:11.5px;color:var(--muted)}
/* changes strip */
.strip{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start;margin:26px 0 8px;padding:18px 22px;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.strip h2{font:600 13px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:3px 0 0}
.changes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,auto);grid-auto-flow:column;gap:10px 26px;margin:0;padding:0;list-style:none}
.changes li{display:flex;align-items:baseline;gap:9px;font-size:14px}
.changes .when{color:var(--muted);font-size:12.5px;min-width:64px}
.changes .ic{width:9px;height:9px;border-radius:50%;flex:none;transform:translateY(-1px);display:inline-block}
.changes .ic.on{background:var(--ember)} .changes .ic.off{border:1.5px solid var(--ink-2)}
.changes .kn{color:var(--muted);font-size:12px}
/* body layout */
.body{display:grid;grid-template-columns:210px minmax(0,1fr);gap:44px;margin-top:40px}
nav.side{position:sticky;top:84px;align-self:start;font-size:13.5px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
nav.side .h{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px}
nav.side a{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink-2);padding:5px 8px;border-radius:8px}
nav.side a:hover{background:var(--surface)} nav.side a.cur{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--ember)}
nav.side a.sig{padding-left:30px;font-size:12.5px}
nav.side .glyph{width:12px;height:12px;border-width:1.5px;box-shadow:none}
nav.side .sep{height:1px;background:var(--border);margin:12px 0}
/* stage sections */
section.stage{padding:30px 0 10px;border-top:1px solid var(--border)}
section.stage:first-of-type{border-top:0;padding-top:0}
.sh{display:grid;grid-template-columns:auto 1fr auto;gap:4px 18px;align-items:baseline;margin:0 0 20px}
.sh .bn{font:500 40px/1 var(--serif);color:var(--muted);grid-row:span 2;opacity:.55}
.sh h2{font:500 32px/1.1 var(--serif);margin:0;letter-spacing:-.005em}
.sh .q{font:italic 400 18px/1.4 var(--serif);color:var(--ink-2);grid-column:2;margin:0}
.sh .st{grid-row:1;grid-column:3;justify-self:end}
.tags{display:flex;gap:8px;flex-wrap:wrap;grid-column:2;margin-top:8px}
.tag{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 8px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:4px 11px 4px 9px;border-radius:999px;border:1px solid var(--border-2);background:var(--surface);white-space:nowrap}
.pill .g{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink-2)}
.pill.on{color:var(--ember-ink);border-color:color-mix(in srgb,var(--ember) 45%,transparent);background:var(--ember-soft)} .pill.on .g{background:var(--ember);border-color:var(--ember)}
.pill.gate{color:var(--ember-ink);border-color:color-mix(in srgb,var(--ember) 45%,transparent);background:var(--ember-soft)} .pill.gate .g{background:var(--ember);border-color:var(--ember)}
.pill.noline .g{border-radius:2px;transform:rotate(45deg);width:9px;height:9px}
.pill.near .g{background:linear-gradient(90deg,var(--ember) 50%,transparent 50%);border-color:var(--ember)}
.pill.ur{color:var(--muted)} .pill.ur .g{border-style:dotted}
.pill.mixed .g{background:linear-gradient(90deg,var(--ember) 50%,transparent 50%);border-color:var(--ember)}
.pill.lit{color:var(--ember-ink);background:var(--ember-soft);border-color:color-mix(in srgb,var(--ember) 45%,transparent)} .pill.lit .g{background:var(--ember);border-color:var(--ember)}
/* signal card */
article.sig{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:26px 28px 22px;margin:0 0 22px}
.ch{display:flex;align-items:flex-start;gap:14px;margin:0 0 18px}
.ch .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 4px}
.ch h3{font:500 25px/1.2 var(--serif);margin:0}
.ch .sp{flex:1}
.cg{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,1fr);gap:32px}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 2px}
.big .v{font:600 50px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big.on .v{color:var(--ember-ink)}
.big .s{font-size:14.5px;color:var(--ink-2);max-width:340px;line-height:1.35}
.dateline{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);margin:8px 0 16px}
.fresh{display:inline-flex;align-items:center;gap:5px} .fresh i{width:7px;height:7px;border-radius:50%;background:var(--s3);display:inline-block}
.fresh.stale i{background:var(--ember)}
.rangebar{display:flex;gap:10px;align-items:center;margin:2px 0 6px}
.rangebar .seg button{font-size:12px;padding:3px 10px}
.ctitle{font-size:13.5px;font-weight:600;margin:14px 0 2px;color:var(--ink)}
.ctitle .cx{font-weight:500;color:var(--muted);font-size:12px;margin-left:8px;letter-spacing:.02em}
.cnote{font-size:12.5px;color:var(--ink-2);margin:2px 0 4px;line-height:1.45}
svg.chart{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
svg.chart:focus{outline:2px solid var(--axis);outline-offset:3px;border-radius:6px}
.tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.lbl{fill:var(--ink-2);font-size:11px} .endlbl{fill:var(--ink);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.toplbl{fill:var(--muted);font-size:10px}
details.tbl{font-size:12.5px;color:var(--ink-2);margin:4px 0 0} details.tbl summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.tbl summary::-webkit-details-marker{display:none} details.tbl summary:before{content:"\25B8";font-size:10px;transition:transform .15s} details.tbl[open] summary:before{transform:rotate(90deg)}
details.tbl .tw{max-height:220px;overflow:auto;margin-top:6px;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:12.5px}
th,td{padding:5px 10px;text-align:right;border-bottom:1px solid var(--grid)} th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
details.more{margin:16px 0 0;border-top:1px solid var(--border);padding-top:10px}
details.more>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);list-style:none}
details.more>summary::-webkit-details-marker{display:none} details.more>summary:before{content:"+ ";color:var(--muted)} details.more[open]>summary:before{content:"\2212  "}
/* right column */
.ex h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
.ex p{margin:0 0 18px;font-size:14.5px;line-height:1.6;color:var(--ink)}
.ex p.read{color:var(--ink-2)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin:4px 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:7px 7px 8px;font-size:12.5px;white-space:nowrap;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ember);font-weight:600}
.panel{font-size:13.5px;line-height:1.6}
.quotes{list-style:none;margin:0;padding:0}
.quotes li{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--grid)}
.quotes .ts{font-size:12px;color:var(--ember-ink);font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
.quotes li:last-child{border-bottom:0}
dl.made{display:grid;grid-template-columns:118px 1fr;gap:7px 12px;margin:0;font-size:13px}
dl.made dt{color:var(--muted)} dl.made dd{margin:0}
.checks{list-style:none;margin:2px 0 6px;padding:0;font-size:13.5px}
.checks li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--grid);align-items:baseline}
.checks .mk{font-weight:700} .checks .mk.ok{color:var(--ember-ink)} .checks .mk.no{color:var(--muted)}
.checks .v{color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.parts{margin:4px 0 6px}
.part{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 34px;gap:10px;align-items:center;padding:6px 0;font-size:13px;border-top:1px solid var(--grid)}
.part .trk{position:relative;height:8px;border-radius:4px;background:var(--surface-2)}
.part .zone{position:absolute;left:80%;right:0;top:0;bottom:0;background:var(--ember-soft);border-radius:0 4px 4px 0}
.part .pt{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);background:var(--s1);border:2px solid var(--surface)}
.part .pt.e{background:var(--ember)} .part .pv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.unrev{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.unrev span{font-size:13px;padding:5px 11px;border:1px dashed var(--border-2);border-radius:999px;color:var(--ink-2)}
.unrev b{color:var(--muted);font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums}
.sub-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:0 0 18px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.tile .l{font-size:12.5px;color:var(--ink-2);line-height:1.35;min-height:34px}
.tile .v{font:600 26px/1.1 var(--sans);font-variant-numeric:tabular-nums;margin:8px 0 2px}
.tile .d{font-size:11.5px;color:var(--muted)}
.tile.fail .v{color:var(--ember-ink);font-size:16px}
.gmocard{background:var(--surface-2);border-radius:14px;padding:16px 18px;margin:0 0 18px;font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.gmocard .gn{font:500 26px/1 var(--serif);color:var(--muted);grid-row:span 2}
.gmocard .gf{font:500 17px/1.3 var(--serif)} .gmocard .gt{color:var(--ink-2);font-size:13.5px}
/* GMO grid */
.gmo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0 0}
.gcard{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .15s}
.gcard:hover,.gcard:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow)} .gcard:focus-visible{outline:2px solid var(--axis)}
.gcard .gn{font:500 30px/1 var(--serif);color:var(--muted)}
.gcard .gf{font:500 15.5px/1.3 var(--serif);min-height:60px}
.gcard .gt{font-size:12.5px;color:var(--ink-2);line-height:1.45;flex:1}
.gcard .gs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);border-top:1px solid var(--grid);padding-top:8px}
.gcard .gs .mini{width:8px;height:8px}
h2.big{font:500 34px/1.15 var(--serif);margin:0 0 6px;letter-spacing:-.005em}
.lead{color:var(--ink-2);margin:0;max-width:800px}
.block{margin-top:56px;padding-top:34px;border-top:1px solid var(--border)}
/* plumbing */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:20px 0 16px}
.st-ok,.st-fail{display:inline-flex;align-items:center;gap:6px;white-space:nowrap} .st-ok i,.st-fail i{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--s3)}
.st-fail{color:var(--ember-ink);font-weight:600} .st-fail i{background:var(--ember)}
.pending{margin:0 0 14px;padding:9px 12px;border-radius:10px;background:var(--ember-soft);color:var(--ember-ink);font-size:13px}

.sum .tile .v{font-size:21px}
.ptbl{border:1px solid var(--border);border-radius:14px;overflow:auto;background:var(--surface)}
.ptbl table{font-size:12.5px} .ptbl td,.ptbl th{text-align:left;vertical-align:top;padding:9px 12px}
.ptbl td.r{text-align:right}
ol.method{margin:14px 0 0;padding-left:20px;color:var(--ink-2);max-width:880px} ol.method li{margin:0 0 8px}
